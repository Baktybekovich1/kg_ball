nelmio_api_doc:
  documentation:
    paths:
      # Исключение путей, начинающихся с /admin
      exclude_patterns:
        - '^/admin'
    info:
      title: My App
      description: This is an awesome app!
      version: 1.0.0
      x-build: #CommitHash
    components:
      securitySchemes:
        Bearer:
          type: http
          scheme: bearer
          bearerFormat: JWT
    security:
      - Bearer: []