server {
    listen 80;
    server_name kgball.dragocorp.tw1.su;

    # Редирект с HTTP на HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name kgball.dragocorp.tw1.su;

    # Путь к SSL сертификатам
    ssl_certificate /etc/letsencrypt/live/kgball.dragocorp.tw1.su/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kgball.dragocorp.tw1.su/privkey.pem;

    root /app/public;
    index index.php;
    charset utf-8;
    client_max_body_size 150m;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    location /img/ {
    }

    location ~ /\. {
        access_log off;
        log_not_found off;
        deny all;
    }
}
