server {
    listen 80;
    server_name $DOMAIN www.$DOMAIN;
    charset utf-8;
    client_max_body_size 5M;
    server_tokens off;

    root /app/public;  # Укажите путь к директории public вашего Symfony проекта

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;  # Убедитесь, что PHP-FPM подключен через контейнер php
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/public$fastcgi_script_name;
        fastcgi_pass php:9000;
    }

    location ~ /\.ht {
        deny all;
    }

    location /static/ {
        alias /app/public/static/;
        expires 15d;
    }

    location /media/ {
        alias /app/public/media/;
        expires 7d;
    }
}
